databases:
  - name: dormitory-db
    region: frankfurt
    plan: free
    databaseName: dormitory
    user: dormitory_user

services:
  - type: web
    name: dormitory-backend
    runtime: docker
    region: frankfurt
    plan: free
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: dormitory-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: dormitory-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: dormitory-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: dormitory-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: dormitory-db
          property: password
      - key: PORT
        value: 8080

  - type: static
    name: dormitory-frontend
    region: frankfurt
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://dormitory-backend.onrender.com