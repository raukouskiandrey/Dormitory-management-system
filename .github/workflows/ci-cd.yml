name: CI/CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build jar
        run: ./mvnw -B clean package -DskipTests

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: testdb
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: ./mvnw -B test

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Railway deployment
        run: |
          echo "Railway is connected to GitHub."
          echo "Push to main triggers automatic deployment."
          echo "Waiting for deployment to roll out..."
          sleep 60

  healthcheck:
    name: Healthcheck
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check /actuator/health
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          echo "Checking health: $APP_URL/actuator/health"

          for i in {1..20}; do
            STATUS=$(curl -s -o response.json -w "%{http_code}" "$APP_URL/actuator/health" || true)
            echo "Attempt $i: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              cat response.json
              grep -q '"status":"UP"' response.json && exit 0
            fi

            sleep 15
          done

          echo "Healthcheck failed"
          cat response.json || true
          exit 1
